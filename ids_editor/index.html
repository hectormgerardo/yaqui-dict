<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words Collection — IDS editor</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe5;
      --panel: #faf7f0;
      --ink: #201f1c;
      --muted: #777168;
      --line: #d9d1c3;
      --accent: #3c5145;
      --focus: #54745f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.45 Georgia, "Times New Roman", serif;
    }

    button, input, select, textarea {
      color: inherit;
      font: inherit;
    }

    button, select, input[type="search"], input[type="text"] {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 4px;
      padding: 9px 11px;
    }

    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .topbar {
      height: 72px;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { font-size: 20px; letter-spacing: -.03em; }
    .brand small {
      display: block;
      color: var(--muted);
      font: 12px/1.4 Arial, sans-serif;
      letter-spacing: .02em;
    }

    .actions, .filters, .entry-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .primary {
      color: var(--panel);
      background: var(--ink);
      border-color: var(--ink);
    }

    .shell {
      min-height: calc(100vh - 112px);
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
    }

    aside {
      padding: 24px 16px;
      border-right: 1px solid var(--line);
    }

    .side-title {
      margin: 0 8px 14px;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .chapter-search {
      width: 100%;
      margin-bottom: 10px;
    }

    #chapterList {
      display: grid;
      gap: 3px;
      max-height: calc(100vh - 210px);
      overflow: auto;
    }

    .chapter {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 10px 9px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink);
    }

    .chapter:hover, .chapter.active { background: #e9e2d5; }
    .chapter .name { overflow: hidden; text-overflow: ellipsis; }
    .chapter .count {
      color: var(--muted);
      font: 12px Arial, sans-serif;
    }

    main { min-width: 0; padding: 28px 34px 40px; }

    .filters {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    #search { width: min(360px, 100%); }
    .filters select { min-width: 145px; }

    .result-line {
      margin: 14px 0 22px;
      color: var(--muted);
      font: 12px Arial, sans-serif;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(230px, 310px) minmax(0, 1fr);
      gap: 28px;
    }

    .entry-list {
      max-height: calc(100vh - 260px);
      overflow: auto;
      border-top: 1px solid var(--line);
    }

    .entry-item {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 14px 10px;
    }

    .entry-item:hover, .entry-item.active { background: #e9e2d5; }
    .entry-item .entry-id {
      display: block;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      margin-bottom: 4px;
    }

    .entry-item .entry-label {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 24px;
    }

    .editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 { margin: 0; font-size: 25px; font-weight: normal; }
    .crumb { color: var(--muted); font: 12px Arial, sans-serif; margin-bottom: 7px; }
    .entry-code {
      color: var(--muted);
      font: 12px Arial, sans-serif;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 18px;
      margin: 18px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0 1px 10px;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      letter-spacing: .08em;
    }

    .tab.active {
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
    }

    .field-label {
      display: block;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      letter-spacing: .09em;
      margin: 0 0 8px;
      text-transform: uppercase;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fffdf8;
      padding: 13px;
      line-height: 1.55;
    }

    .field-help {
      color: var(--muted);
      font: 12px Arial, sans-serif;
      margin-top: 8px;
    }

    .meta {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 12px Arial, sans-serif;
    }

    .empty {
      padding: 30px 10px;
      color: var(--muted);
    }

    footer {
      height: 40px;
      border-top: 1px solid var(--line);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font: 11px Arial, sans-serif;
    }

    #fileInput { display: none; }

    @media (max-width: 800px) {
      .topbar { height: auto; padding: 16px; align-items: flex-start; }
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; }
      #chapterList {
        display: flex;
        max-height: none;
        overflow-x: auto;
      }
      .chapter { width: auto; flex: 0 0 auto; }
      main { padding: 20px 14px; }
      .workspace { grid-template-columns: 1fr; }
      .entry-list { max-height: 230px; }
      .editor { padding: 17px; }
      .entries-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .entries-heading .side-title {
        margin-bottom: 10px;
      }

      #addElementButton {
        margin-bottom: 10px;
        padding: 6px 9px;
        font: 12px Arial, sans-serif;
      }

      #addElementButton:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      Words Collection
      <small>IDS-aligned lexical database · <span id="fileLabel">No file loaded</span></small>
    </div>
    <div class="actions">
      <button id="openButton">Open JSON</button>
      <button id="saveButton">Download JSON</button>
      <button id="exportButton" class="primary">Export CSV / TSV</button>
      <input id="fileInput" type="file" accept=".json,application/json">
    </div>
  </header>

  <div class="shell">
    <aside>
      <div class="side-title">Chapters</div>
      <input id="chapterSearch" class="chapter-search" type="search"
             placeholder="Find a chapter…" aria-label="Find a chapter">
      <nav id="chapterList" aria-label="Chapter filters"></nav>
    </aside>

    <main>
      <div class="filters">
        <input id="search" type="search" placeholder="Search entries…"
               aria-label="Search entries">
        <select id="completeness" aria-label="Filter by completeness">
          <option value="all">All entries</option>
          <option value="missing">Missing fields</option>
          <option value="complete">Complete entries</option>
        </select>
        <select id="sort" aria-label="Sort entries">
          <option value="id">Sort by ID</option>
          <option value="en">Sort by English</option>
        </select>
      </div>

      <div class="result-line" id="resultCount"></div>

      <div class="workspace">
<!--         <section>
          <div class="side-title">Entries</div>
          <div id="entryList" class="entry-list"></div>
        </section> -->
        <section>
          <div class="entries-heading">
            <div class="side-title">Entries</div>
            <button id="addElementButton" type="button">+ Add element</button>
          </div>
          <div id="entryList" class="entry-list"></div>
        </section>
        <section id="editorArea"></section>
      </div>
    </main>
  </div>

  <footer>
    <span id="status">Open a JSON file to begin.</span>
    <span>JSON structure: chapter → entry</span>
  </footer>
<script src="app.js" defer></script>

        $("resultCount").textContent = `${entries.length} ${entries.length === 1 ? "entry" : "entries"}`;

          button.onclick = () => {

          list.append(button);

        if (!entries.some((entry) => entry.id === selectedId)) {

        renderEditor(entries.find((entry) => entry.id === selectedId));

      function renderEditor(entry) {

          $("editorArea").innerHTML = '<div class="empty">Select an entry to edit.</div>';
          return;

        const area = $("editorArea");

      function download(content, name, type) {
        const blob = new Blob([content], { type });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function saveJson() {
        download(JSON.stringify(data, null, 2) + "\n", fileName, "application/json");
        dirty = false;
        $("status").textContent = "JSON downloaded";

      function csvCell(value, delimiter) {
        const text = String(value ?? "");
        return /["\r\n]/.test(text) || text.includes(delimiter)
          ? `"${text.replaceAll('"', '""')}"`
          : text;
      }

      function exportDelimited(delimiter, extension) {
        const rows = [["id", "group_id", "element_id", ...FIELDS]];
        for (const entry of getVisibleEntries()) {
          rows.push([
            entry.id,
            entry.groupId,
            entry.elementId,
            ...FIELDS.map((field) => entry.fields[field])
          ]);
        }
        const content = rows
          .map((row) => row.map((cell) => csvCell(cell, delimiter)).join(delimiter))
          .join("\r\n");
        download("\uFEFF" + content, `words.${extension}`, "text/plain;charset=utf-8");
        $("status").textContent = `${extension.toUpperCase()} exported`;
      }

      function openJsonFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            data = convertToGrouped(parsed);
            fileName = file.name;
            selectedChapter = "all";
            selectedId = null;
            dirty = false;
            $("status").textContent = "JSON loaded";
            render();
          } catch (error) {
            alert(`Could not load JSON: ${error.message}`);
          }
        };
        reader.readAsText(file);
      }

      function convertToGrouped(parsed) {
        // Accept grouped JSON as-is.
        if (parsed?.words_collection && !Array.isArray(parsed.words_collection)) {
          return parsed;
        }

        // Also accept the earlier flat JSON array format.
        const rows = Array.isArray(parsed) ? parsed : parsed?.words_collection;
        if (!Array.isArray(rows)) {
          throw new Error("Expected a grouped words_collection object or a JSON array.");
        }

        const result = {
          words_collection: {},
          ...(parsed && !Array.isArray(parsed) ? { chapter_names: parsed.chapter_names || {} } : {})
        };

        for (const row of rows) {
          const id = String(row.id || `${row.group_id}.${row.element_id}`);
          const match = id.match(/^(\d+)\.(\d+)$/);
          if (!match) throw new Error(`Invalid entry ID: ${id}`);

          const [, groupId, elementId] = match;
          result.words_collection[groupId] ??= {};
          result.words_collection[groupId][elementId] = normalizeFields(row);
        }

        return result;
      }

        if (file) openJsonFile(file);
        event.target.value = "";

        const format = choice.trim().toLowerCase();
        if (format === "csv") exportDelimited(",", "csv");
        else if (format === "tsv") exportDelimited("\t", "tsv");
        else alert("Enter CSV or TSV.");
      };

      $("search").oninput = renderEntries;
      $("completeness").onchange = renderEntries;
